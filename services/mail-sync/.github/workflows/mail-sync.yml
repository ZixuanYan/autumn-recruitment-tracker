name: mail-sync

# 定时（每小时尝试）+ 手动触发：IMAP 增量拉取 → 预筛 → AI 判定 → 只 PATCH Gist 的 mail-suggestions.json。
#
# ⚠️ cron 是**触发粒度**，不是拉取频率。真正的频率由 minIntervalHours 决定
#    （网页端「邮件提醒 → 设置 → 最小间隔（小时）」，写进 Gist 的 mail-config.json）：
#    距上次运行不足该小时数就跳过，跳过的那次不连 IMAP、不调 AI（0 token）。
#    v4.15.0 之前这里是每 12 小时，minIntervalHours 只能把频率调得更疏、调不到 12 小时以内；
#    现在改为每小时尝试后，它才支持 1 / 2 / 3 / 6 / 12 / 24 …，默认值仍是 12 小时，
#    所以未改设置的人行为不变。
# 代价（私有仓库要算）：npm install 在**每次**触发都会跑，被跳过的运行也照样消耗
#    Actions 分钟（通常不足 1 分钟/次，但私有仓按分钟计费）。每小时约 720 次/月，
#    若每次按 1 分钟计，约占私有仓 2000 分钟/月免费额度的 36%；公开仓库免费。
# 精度（平台限制，改 cron 无法解决）：GitHub 的 schedule 在高峰期常延迟 2–4 小时，
#    所以 minIntervalHours 是「不会比这更密」的下限，不是精确周期。
# 保活提示：GitHub Actions 对 60 天无活动的仓库会停用定时 workflow，需偶尔手动 dispatch 一次保活。
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      SINCE_DAYS:
        description: '增量回看天数（覆盖默认 30；首次或 UIDVALIDITY 变化时生效）'
        required: false
        type: string
      MAX_PER_RUN:
        description: '单次最多处理邮件数（覆盖默认 30）'
        required: false
        type: string
      UID_FROM:
        description: '回溯起点 UID：忽略云端水位，从该 UID 起重新扫描（用于捞回被误杀的邮件；建议同时调大 MAX_PER_RUN）'
        required: false
        type: string
      RETRY_FAILED:
        description: '重试 Gist 中记录的 AI 失败邮件（无需填写 UID）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mail-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run mail sync
        env:
          # 凭据双读：新名字 MAIL_USER / MAIL_PASS 优先，回落到旧的 QQ_EMAIL / QQ_AUTHCODE。
          # 这样已经配好 QQ 的部署**一个 Secret 都不用改**就能继续跑；换 163 等其它邮箱时
          # 只需新增 MAIL_USER / MAIL_PASS 两个 Secret（旧的可以留着，也可以删）。
          # 刻意不直接重命名旧 Secret：那会让所有既有部署在下一次定时任务时静默登录失败，
          # 而症状只是"邮件没更新"，极难归因。
          MAIL_USER: ${{ secrets.MAIL_USER || secrets.QQ_EMAIL }}
          MAIL_PASS: ${{ secrets.MAIL_PASS || secrets.QQ_AUTHCODE }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTHCODE: ${{ secrets.QQ_AUTHCODE }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
          MAIL_ENC_KEY: ${{ secrets.MAIL_ENC_KEY }}
          # IMAP 主机与端口走仓库 **Variables**（Settings → Secrets and variables → Actions → Variables），
          # 不是 Secrets：主机名与端口不是敏感信息，用 Variables 设置更轻、也能在仓库页面直接看到当前值。
          # 未设置时回落到 QQ，所以既有部署行为逐字节不变。
          #   163 邮箱：IMAP_HOST = imap.163.com    IMAP_PORT = 993
          #   126 邮箱：IMAP_HOST = imap.126.com    IMAP_PORT = 993
          #   QQ/foxmail：留空即可（就是默认值）
          # ⚠️ 不要再把主机名写死成字面量：v4.17.0 之前这里就是 `imap.qq.com`，
          # 于是 config.js 里明明已经支持 IMAP_HOST 环境变量，却永远读不到别的值
          # ——能力在代码里，被部署配置堵死了。test/run.js 有守卫盯着这一点。
          IMAP_HOST: ${{ vars.IMAP_HOST || 'imap.qq.com' }}
          IMAP_PORT: ${{ vars.IMAP_PORT || '993' }}
          # 时区偏移（v4.24.0）：把邮件里的相对期限（"3 日内 / 48 小时内"）换算成绝对时间时
          # 用作基准。同样走 Variables（不是密钥），未设置时回落到 +08:00，既有部署零改动。
          #   常见取值：+08:00（中国）/ +09:00（日韩）/ +00:00（UTC）/ -05:00（美东）
          MAIL_TZ_OFFSET: ${{ vars.MAIL_TZ_OFFSET || '+08:00' }}
          SINCE_DAYS: ${{ github.event.inputs.SINCE_DAYS || '30' }}
          MAX_PER_RUN: ${{ github.event.inputs.MAX_PER_RUN || '30' }}
          # 留空 = 正常按云端水位增量；填 UID 则忽略水位从该处重扫（回溯被误杀的邮件）
          UID_FROM: ${{ github.event.inputs.UID_FROM || '' }}
          RETRY_FAILED: ${{ github.event.inputs.RETRY_FAILED || 'false' }}
          MIN_CONFIDENCE: '0.3'
          # 可选：设置 KEYWORDS Secret 即可覆盖默认关键词（留空则用 src/config.js 的 DEFAULT_KEYWORDS）
          KEYWORDS: ${{ secrets.KEYWORDS }}
        run: node index.js

      # 兜底：主步骤硬失败时，把 meta.lastError 写进 Gist（保留已有 suggestions/水位），网页端可上屏提示。
      - name: Report error to Gist (fallback)
        if: failure()
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
          MAIL_ENC_KEY: ${{ secrets.MAIL_ENC_KEY }}
          MAIL_SYNC_ERROR: '邮件同步失败，请查看本次 Action 日志（常见原因：邮箱授权码失效或过期 / IMAP 主机配错 / AI 超额 / 服务商风控）'
        run: node index.js --report-error
